name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # One install for every workspace — the same resolution the Vercel build uses,
      # so a dependency declared in the wrong place fails here and not in production.
      - name: Install
        run: npm ci
        env:
          # onnxruntime-node's postinstall only downloads the CUDA 12 GPU add-on on Linux (the CPU binaries ship in the
          # package). CI has no GPU, and that download from Microsoft's feed kept timing out and failing the install.
          ONNXRUNTIME_NODE_INSTALL: skip
          # kokoro-js pins an older onnxruntime-node whose script ignores the line above and reads this one; its CUDA
          # download is now a 404, which failed the install.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
